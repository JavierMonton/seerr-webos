name: Build IPK

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check JS syntax
        run: node --check seerr-webos/app.js

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          APP="$(python3 -c "import json;print(json.load(open('seerr-webos/appinfo.json'))['version'])")"
          test "$TAG" = "$APP" || { echo "tag v$TAG != appinfo.json $APP"; exit 1; }

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Package IPK
        run: |
          mkdir -p dist
          cd seerr-webos
          ares-package . -o ../dist --no-minify

      - name: Generate Homebrew manifest
        run: |
          python3 tools/mkmanifest.py dist/*.ipk \
            --repo "${{ github.server_url }}/${{ github.repository }}" \
            --out dist/io.github.javiermonton.seerr.manifest.json
          cat dist/*.manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/*.manifest.json
